name: Render field notes

on:
  workflow_dispatch:          # run on demand from the Actions tab
  push:
    branches: [main]
    paths:
      - data/activity.json
      - scripts/render_activity.py
      - .github/workflows/refresh-activity.yml

permissions:
  contents: write

concurrency:
  group: render-field-notes
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render Field Notes and archive
        run: python scripts/render_activity.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md ACTIVITY.md; then
            echo "Field notes already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ACTIVITY.md
          git commit -m "chore: render field notes [skip ci]"
          git push
