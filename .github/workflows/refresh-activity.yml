name: Refresh activity panel

on:
  schedule:
    - cron: "17 4 * * *"   # daily at 04:17 UTC
  workflow_dispatch:         # run on demand from the Actions tab
  push:
    branches: [main]
    paths:
      - scripts/generate_activity.py
      - .github/workflows/refresh-activity.yml

permissions:
  contents: write

concurrency:
  group: refresh-activity
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate assets/activity.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_activity.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/activity.svg; then
            echo "No change in activity panel."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          git commit -m "chore: refresh activity panel [skip ci]"
          git push
