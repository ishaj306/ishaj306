<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-labelledby="st sd">
  <title id="st">Signature</title>
  <desc id="sd">The moon does not compete with the stars. It simply rises. — Isha</desc>
  <defs>
    <radialGradient id="bg3" cx="50%" cy="30%" r="100%">
      <stop offset="0%" stop-color="#3d0020"/>
      <stop offset="60%" stop-color="#2d0014"/>
      <stop offset="100%" stop-color="#180009"/>
    </radialGradient>
    <radialGradient id="mg2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8c97a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e8c97a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9a84c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </linearGradient>
    <mask id="crescent2">
      <circle r="22" fill="#fff"/>
      <circle r="22" cx="10" cy="-6" fill="#000"/>
    </mask>
  </defs>
  <rect width="1200" height="240" fill="url(#bg3)"/>

  <g fill="#f5edd8">
    <circle cx="470" cy="70" r="1.3" opacity="0.7"/>
    <circle cx="760" cy="60" r="1.1" opacity="0.6"/>
    <circle cx="660" cy="95" r="1" opacity="0.5"/>
    <circle cx="540" cy="110" r="1" opacity="0.5"/>
  </g>

  <!-- moon -->
  <g transform="translate(600 72)">
    <circle r="42" fill="url(#mg2)">
      <animate attributeName="r" values="38;46;38" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle r="22" fill="#e8c97a" mask="url(#crescent2)"/>
  </g>

  <text x="600" y="165" text-anchor="middle" fill="#f5edd8" font-size="30" font-style="italic" font-family="Georgia, 'Times New Roman', serif">The moon does not compete with the stars. It simply rises.</text>
  <text x="600" y="205" text-anchor="middle" fill="#c9a84c" font-size="18" letter-spacing="4" font-family="Verdana, Geneva, sans-serif">&#8212; ISHA</text>
  <line x1="500" y1="222" x2="700" y2="222" stroke="url(#fade2)" stroke-width="1"/>
</svg>
