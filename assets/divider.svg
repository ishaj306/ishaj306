      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="26s" repeatCount="indefinite"/>
    </path>
    <circle cx="0" cy="0" r="2.4" fill="#ff4d6d">
      <animate attributeName="r" values="2.4;3.4;2.4" dur="3s" repeatCount="indefinite"/>
