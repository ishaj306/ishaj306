<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 476" width="1200" height="476" role="img" aria-labelledby="at ad">
  <title id="at">The work, in motion</title>
  <desc id="ad">Language distribution — TypeScript 38%, Java 35%, Python 14%, C 4%, JavaScript 3%, other 6%. Recently active: live-meeting-notes, HastaMudra, SkillScope, AcadFlow, aura.</desc>
  <defs>
    <radialGradient id="abg" cx="50%" cy="0%" r="120%">
      <stop offset="0%" stop-color="#3d0020"/>
      <stop offset="60%" stop-color="#2d0014"/>
      <stop offset="100%" stop-color="#180009"/>
    </radialGradient>
    <clipPath id="barclip"><rect x="80" y="162" width="1040" height="26" rx="8"/></clipPath>
  </defs>
  <rect width="1200" height="476" fill="url(#abg)"/>

  <!-- header -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.1s" fill="freeze"/>
    <text x="600" y="60" text-anchor="middle" fill="#c9a84c" font-size="22" letter-spacing="8" font-family="Verdana, Geneva, sans-serif">THE WORK, IN MOTION</text>
    <text x="600" y="92" text-anchor="middle" fill="#c4a882" font-size="17" font-style="italic" font-family="Georgia, 'Times New Roman', serif">A snapshot of what I've been building lately.</text>
    <line x1="520" y1="112" x2="680" y2="112" stroke="#c9a84c" stroke-width="1" opacity="0.5"/>
  </g>

  <g font-family="Verdana, Geneva, sans-serif">
    <!-- language distribution -->
    <text x="80" y="150" fill="#c9a84c" font-size="13" letter-spacing="3">LANGUAGE DISTRIBUTION</text>
    <g clip-path="url(#barclip)">
      <rect x="80" y="162" width="1040" height="26" fill="#231018"/>
      <rect x="80"   y="162" width="0" height="26" fill="#c9a84c"><animate attributeName="width" values="0;397" dur="0.9s" begin="0.5s" fill="freeze"/></rect>
      <rect x="477"  y="162" width="0" height="26" fill="#e8c97a"><animate attributeName="width" values="0;366" dur="0.9s" begin="0.7s" fill="freeze"/></rect>
      <rect x="843"  y="162" width="0" height="26" fill="#ff4d6d"><animate attributeName="width" values="0;147" dur="0.9s" begin="0.9s" fill="freeze"/></rect>
      <rect x="990"  y="162" width="0" height="26" fill="#c4a882"><animate attributeName="width" values="0;38"  dur="0.9s" begin="1.1s" fill="freeze"/></rect>
      <rect x="1028" y="162" width="0" height="26" fill="#f5edd8"><animate attributeName="width" values="0;33"  dur="0.9s" begin="1.2s" fill="freeze"/></rect>
      <rect x="1061" y="162" width="0" height="26" fill="#7a5a63"><animate attributeName="width" values="0;59"  dur="0.9s" begin="1.3s" fill="freeze"/></rect>
    </g>

    <!-- legend -->
    <g opacity="0" font-size="14">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.3s" fill="freeze"/>
      <circle cx="86"  cy="214" r="5" fill="#c9a84c"/><text x="98"  y="219" fill="#f5edd8">TypeScript</text><text x="200" y="219" fill="#c4a882">38%</text>
      <circle cx="266" cy="214" r="5" fill="#e8c97a"/><text x="278" y="219" fill="#f5edd8">Java</text><text x="336" y="219" fill="#c4a882">35%</text>
      <circle cx="410" cy="214" r="5" fill="#ff4d6d"/><text x="422" y="219" fill="#f5edd8">Python</text><text x="502" y="219" fill="#c4a882">14%</text>
      <circle cx="576" cy="214" r="5" fill="#c4a882"/><text x="588" y="219" fill="#f5edd8">C</text><text x="620" y="219" fill="#c4a882">4%</text>
      <circle cx="700" cy="214" r="5" fill="#f5edd8"/><text x="712" y="219" fill="#f5edd8">JavaScript</text><text x="816" y="219" fill="#c4a882">3%</text>
