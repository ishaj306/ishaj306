        <circle cx="88" cy="304" r="3.5" fill="#e8c97a"/><text x="104" y="309" fill="#f5edd8" font-size="15">live-meeting-notes</text>
        <text x="470" y="309" fill="#c4a882" font-size="14">Python</text><text x="1120" y="309" text-anchor="end" fill="#c4a882" font-size="14">updated Sep 2026</text>
        <line x1="80" y1="322" x2="1120" y2="322" stroke="#c9a84c" stroke-width="1" opacity="0.1"/>
      </g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.65s" fill="freeze"/>
        <circle cx="88" cy="340" r="3.5" fill="#e8c97a"/><text x="104" y="345" fill="#f5edd8" font-size="15">HastaMudra</text>
        <text x="470" y="345" fill="#c4a882" font-size="14">Python &#183; Computer Vision</text><text x="1120" y="345" text-anchor="end" fill="#c4a882" font-size="14">updated Aug 2026</text>
        <line x1="80" y1="358" x2="1120" y2="358" stroke="#c9a84c" stroke-width="1" opacity="0.1"/>
      </g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.8s" fill="freeze"/>
        <circle cx="88" cy="376" r="3.5" fill="#e8c97a"/><text x="104" y="381" fill="#f5edd8" font-size="15">SkillScope</text>
        <text x="470" y="381" fill="#c4a882" font-size="14">TypeScript &#183; Next.js</text><text x="1120" y="381" text-anchor="end" fill="#c4a882" font-size="14">updated Aug 2026</text>
        <line x1="80" y1="394" x2="1120" y2="394" stroke="#c9a84c" stroke-width="1" opacity="0.1"/>
      </g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.95s" fill="freeze"/>
        <circle cx="88" cy="412" r="3.5" fill="#e8c97a"/><text x="104" y="417" fill="#f5edd8" font-size="15">AcadFlow</text>
        <text x="470" y="417" fill="#c4a882" font-size="14">Java &#183; Spring Boot &#183; OR-Tools</text><text x="1120" y="417" text-anchor="end" fill="#c4a882" font-size="14">updated Aug 2026</text>
        <line x1="80" y1="430" x2="1120" y2="430" stroke="#c9a84c" stroke-width="1" opacity="0.1"/>
      </g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.7s" begin="2.1s" fill="freeze"/>
        <circle cx="88" cy="448" r="3.5" fill="#e8c97a"/><text x="104" y="453" fill="#f5edd8" font-size="15">aura</text>
        <text x="470" y="453" fill="#c4a882" font-size="14">Python &#183; LangChain &#183; LangGraph</text><text x="1120" y="453" text-anchor="end" fill="#c4a882" font-size="14">updated Aug 2026</text>
